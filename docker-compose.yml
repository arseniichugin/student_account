# Локально:   docker compose up -d db          — только база, приложение через npm run dev
# На сервере: mkdir -m 700 secrets             — папка для логинов и паролей, которые выдаёт импорт
#             docker compose run --rm migrate  — миграции + импорт data/university + демо-данные
#             docker compose up -d app         — приложение и база
#
# Пароль базы берётся из файла .env (POSTGRES_PASSWORD) и не хранится в репозитории.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: student_account
      POSTGRES_DB: student_account
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Только для этого компьютера: база не видна из интернета.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_account -d student_account"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    command: npm run db:setup
    environment:
      DATABASE_URL: postgresql://student_account:${POSTGRES_PASSWORD}@db:5432/student_account
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TEST_STUDENT_LOGINS: ${TEST_STUDENT_LOGINS:-}
      # Логины и пароли студентов импорт пишет в ./secrets/credentials.csv на сервере (не в образ).
      CREDENTIALS_FILE: /out/credentials.csv
    volumes:
      # Файлы вуза берутся с диска сервера: заменили их — пересобирать образ не нужно.
      - ./data/university:/app/data/university:ro
      # Только отдельная папка для credentials.csv: контейнер работает от root,
      # и доступ на запись ко всему проекту ему не нужен. Создайте её заранее: mkdir -m 700 secrets
      - ./secrets:/out
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://student_account:${POSTGRES_PASSWORD}@db:5432/student_account
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Публичный стенд: демо-аккаунты общие, смена пароля отключена.
      DEMO_MODE: ${DEMO_MODE:-1}
      # Название вуза в интерфейсе (по умолчанию «Хогвартс»), см. data/university/README.md.
      UNIVERSITY_NAME: ${UNIVERSITY_NAME:-}
      # Приложение доступно только через прокси (Caddy/nginx) на этом же сервере,
      # который выставляет X-Real-IP, поэтому этому заголовку можно верить.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Ограничение памяти Node.js: без него под нагрузкой процесс занимает ~800 МБ
      # (замер 8 ноября, docs/DEPLOYMENT.md). 512 МБ хватает с запасом.
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      # Файлы вуза с диска сервера: карта кампуса читается из них при каждом запросе.
      - ./data/university:/app/data/university:ro
    ports:
      # Только 127.0.0.1: снаружи приложение доступно лишь через HTTPS-прокси.
      # (Docker обходит правила ufw, поэтому открытый порт был бы виден из интернета.)
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
