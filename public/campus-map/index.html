<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта кампуса</title>
  <link rel="stylesheet" href="campus-map.css">
  <style>
    body { margin: 0; padding: 16px; background: #efece5; }
    @media (prefers-color-scheme: dark) { body { background: #121110; } }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { font: 600 22px system-ui, sans-serif; margin: 0 0 12px; color: inherit; }
    @media (prefers-color-scheme: dark) { h1 { color: #ece8df; } }
    .note { font: 12px system-ui, sans-serif; color: #8a8478; margin-top: 10px; }
  </style>
</head>
<body>
<main>
  <h1>Карта кампуса</h1>
  <div id="campus-map"></div>
  <p class="note">Концепт для конкурса, не официальный сервис. Пример ссылки на аудиторию: <a href="#room=3041">#room=3041</a></p>
</main>
<script src="campus-data.js"></script>
<script src="campus-map.js"></script>
<script>
  window.campusMap = HogwartsMap.mount(document.getElementById('campus-map'), { data: window.CAMPUS_DATA });
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/room=([^&]+)/);
    if (m) campusMap.focus(decodeURIComponent(m[1]));
  });
</script>
</body>
</html>
